<!doctype html>
<html lang="en" data-bs-theme="{{ settings.theme if settings else 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insta Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="toast-container position-fixed top-0 end-0 p-3">
      {% for category, message in messages %}
      <div class="toast align-items-center text-bg-{{ 'danger' if category=='danger' else 'success' }} border-0 show mb-2"><div class="d-flex"><div class="toast-body">{{ message }}</div></div></div>
      {% endfor %}
    </div>
  {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
