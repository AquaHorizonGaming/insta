{% extends 'base.html' %}
{% block body %}
<div class="p-4">
  <h3>Logs</h3>
  <div class="mb-2"><a href="/logs/csv" class="btn btn-outline-primary btn-sm">Download CSV</a>
    <form method="post" action="/logs/clear" class="d-inline" onsubmit="return confirm('Clear logs?')"><button class="btn btn-outline-danger btn-sm">Clear Logs</button></form>
    <a href="/" class="btn btn-secondary btn-sm">Back</a>
  </div>
  <table class="table table-striped table-sm">
    <thead><tr><th>Timestamp</th><th>Action</th><th>Username</th><th>Shortcode</th><th>Status</th><th>Details</th></tr></thead>
    <tbody>{% for l in logs %}<tr><td>{{ l.ts }}</td><td>{{ l.action }}</td><td>{{ l.creator_username }}</td><td>{{ l.post_shortcode }}</td><td>{{ l.status }}</td><td>{{ l.details }}</td></tr>{% endfor %}</tbody>
  </table>
</div>
{% endblock %}
